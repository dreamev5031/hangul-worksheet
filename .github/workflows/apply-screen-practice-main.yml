name: Apply and merge stroke-order practice
# Registered workflow trigger

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-screen-practice-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout existing work branch
        uses: actions/checkout@v4
        with:
          ref: agent/screen-practice
          fetch-depth: 0

      - name: Apply source archive and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/payload-part-* | base64 --decode > /tmp/screen-practice-update.tar.gz
          echo "c08ee5a5d4671c2594c85e06043c0100912abebdfccd774d74cbee4ffac9a5f3  /tmp/screen-practice-update.tar.gz" | sha256sum --check
          tar -xzf /tmp/screen-practice-update.tar.gz
          rm -rf .automation tests/runtime
          rm -f src/practice/scoring.ts src/practice/feedback.ts
          rm -f .github/workflows/apply-screen-practice.yml

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Smoke-test static routes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/hangul-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/home.html; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/practice/ >/tmp/practice.html
          curl --fail --silent http://127.0.0.1:4173/privacy/ >/tmp/privacy.html
          grep -q '<div id="root"></div>' /tmp/home.html
          grep -q '<div id="root"></div>' /tmp/practice.html
          grep -q '<div id="root"></div>' /tmp/privacy.html

      - name: Commit verified branch implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes were produced" >&2
            exit 1
          fi
          git commit -m "화면 연습을 한글 획순 따라쓰기로 전환"
          git push origin HEAD:agent/screen-practice

      - name: Merge verified branch into main and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/screen-practice
          git checkout -B main origin/main
          git rm .github/workflows/apply-screen-practice-main.yml
          git commit -m "일회성 획순 적용 워크플로 제거"
          git merge --no-ff origin/agent/screen-practice -m "한글 획순 따라쓰기 화면 연습 병합"
          git push origin main
