name: Production smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build expected production output
        run: |
          npm ci
          npm run build
      - name: Verify Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          base='https://hangul-worksheet.pages.dev'
          expected_asset="$(grep -oE 'src=\"/assets/[^\"]+\.js\"' dist/practice/index.html | head -1 | cut -d'"' -f2)"
          test -n "$expected_asset"

          success=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 25 "$base/" -o /tmp/home.html \
              && curl --fail --silent --show-error --location --max-time 25 "$base/practice/" -o /tmp/practice.html \
              && curl --fail --silent --show-error --location --max-time 25 "$base/privacy/" -o /tmp/privacy.html \
              && curl --fail --silent --show-error --location --max-time 25 "$base/robots.txt" -o /tmp/robots.txt \
              && curl --fail --silent --show-error --location --max-time 25 "$base/sitemap.xml" -o /tmp/sitemap.xml \
              && grep -Fq "$expected_asset" /tmp/practice.html; then
              success=1
              break
            fi
            echo "Production has not reached the expected asset yet: attempt $attempt/30"
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Expected production asset was not observed: $expected_asset" >&2
            exit 1
          fi

          grep -Fq '<title>화면 한글 따라쓰기 연습 | 오늘의 한글 학습지</title>' /tmp/practice.html
          grep -Fq '한글의 올바른 획순을 한 획씩 안내' /tmp/practice.html
          grep -Fq '<link rel="canonical" href="https://hangul-worksheet.pages.dev/practice/"' /tmp/practice.html
          grep -Fq '필기 이미지와 실제 획 좌표는 저장하지 않습니다' /tmp/privacy.html
          grep -Fq 'Sitemap: https://hangul-worksheet.pages.dev/sitemap.xml' /tmp/robots.txt
          grep -Fq '<loc>https://hangul-worksheet.pages.dev/practice/</loc>' /tmp/sitemap.xml

          curl --fail --silent --show-error --location --max-time 25 "$base$expected_asset" -o /tmp/app.js
          grep -Fq '획순 연습 시작하기' /tmp/app.js
          grep -Fq '참 잘했어요!' /tmp/app.js
          grep -Fq 'PDF로 저장' /tmp/app.js
          grep -Fq '인쇄하기' /tmp/app.js
          if grep -Fq '채점하기' /tmp/app.js; then
            echo 'Legacy score action remains in production bundle' >&2
            exit 1
          fi

          echo "Production verified with asset: $expected_asset"
