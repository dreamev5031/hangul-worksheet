name: Production smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build expected production output
        run: |
          npm ci
          npm run build
      - name: Wait for expected Cloudflare asset
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://hangul-worksheet.pages.dev'
          expected_asset="$(grep -oE 'src=\"/assets/[^\"]+\.js\"' dist/practice/index.html | head -1 | cut -d'"' -f2)"
          test -n "$expected_asset"
          echo "asset=$expected_asset" >> "$GITHUB_OUTPUT"

          success=0
          for attempt in {1..36}; do
            home_status="$(curl --silent --show-error --location --max-time 25 --output /tmp/home.html --write-out '%{http_code}' "$base/" || true)"
            practice_status="$(curl --silent --show-error --location --max-time 25 --output /tmp/practice.html --write-out '%{http_code}' "$base/practice/" || true)"
            privacy_status="$(curl --silent --show-error --location --max-time 25 --output /tmp/privacy.html --write-out '%{http_code}' "$base/privacy/" || true)"
            robots_status="$(curl --silent --show-error --location --max-time 25 --output /tmp/robots.txt --write-out '%{http_code}' "$base/robots.txt" || true)"
            sitemap_status="$(curl --silent --show-error --location --max-time 25 --output /tmp/sitemap.xml --write-out '%{http_code}' "$base/sitemap.xml" || true)"
            current_asset="$(grep -oE 'src=\"/assets/[^\"]+\.js\"' /tmp/practice.html 2>/dev/null | head -1 | cut -d'"' -f2 || true)"
            echo "attempt=$attempt home=$home_status practice=$practice_status privacy=$privacy_status robots=$robots_status sitemap=$sitemap_status current=$current_asset expected=$expected_asset"
            if [ "$home_status" = 200 ] \
              && [ "$practice_status" = 200 ] \
              && [ "$privacy_status" = 200 ] \
              && [ "$robots_status" = 200 ] \
              && [ "$sitemap_status" = 200 ] \
              && [ "$current_asset" = "$expected_asset" ]; then
              success=1
              break
            fi
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Expected production asset was not observed: $expected_asset" >&2
            exit 1
          fi
      - name: Verify production metadata and routes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<title>화면 한글 따라쓰기 연습 | 오늘의 한글 학습지</title>' /tmp/practice.html
          grep -Fq '한글의 올바른 획순을 한 획씩 안내' /tmp/practice.html
          grep -Fq '<link rel="canonical" href="https://hangul-worksheet.pages.dev/practice/"' /tmp/practice.html
          grep -Fq '<link rel="canonical" href="https://hangul-worksheet.pages.dev/privacy/"' /tmp/privacy.html
          grep -Fq 'Sitemap: https://hangul-worksheet.pages.dev/sitemap.xml' /tmp/robots.txt
          grep -Fq '<loc>https://hangul-worksheet.pages.dev/practice/</loc>' /tmp/sitemap.xml
      - name: Verify production application bundle
        shell: bash
        run: |
          set -euo pipefail
          base='https://hangul-worksheet.pages.dev'
          asset='${{ steps.deployment.outputs.asset }}'
          curl --fail --silent --show-error --location --max-time 25 "$base$asset" -o /tmp/app.js
          grep -Fq '획순 연습 시작하기' /tmp/app.js
          grep -Fq '참 잘했어요!' /tmp/app.js
          grep -Fq '필기 이미지와 실제 획 좌표는 저장하지 않습니다' /tmp/app.js
          grep -Fq 'canonical-stroke-rendering-v2' /tmp/app.js
          grep -Fq 'practice-side-panel' /tmp/app.js
          grep -Fq 'tablet-landscape' /tmp/app.js
          grep -Fq 'PDF로 저장' /tmp/app.js
          grep -Fq '인쇄하기' /tmp/app.js
          if grep -Fq 'display-glyph-layer-v1' /tmp/app.js; then
            echo 'Legacy system-font display glyph remains in production bundle' >&2
            exit 1
          fi
          if grep -Fq '채점하기' /tmp/app.js; then
            echo 'Legacy score action remains in production bundle' >&2
            exit 1
          fi
          echo "Production canonical stroke bundle verified: $asset"
      - name: Install Korean UI font for readable screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Verify live canonical stroke screens
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p artifacts/production-canonical
          scenarios=(
            'tablet-portrait-ba 768 1024 portrait %EB%B0%94'
            'tablet-portrait-da 768 1024 portrait %EB%8B%A4'
            'tablet-portrait-bam 768 1024 portrait %EB%B0%A4'
            'tablet-landscape-hwang 1024 768 tablet-landscape %ED%99%A9'
            'tablet-landscape-seul 1024 768 tablet-landscape %EC%8A%AC'
            'phone-portrait-da 390 844 portrait %EB%8B%A4'
            'phone-landscape-bam 844 390 phone-landscape %EB%B0%A4'
          )
          for scenario in "${scenarios[@]}"; do
            read -r name width height expected_mode encoded <<<"$scenario"
            url="https://hangul-worksheet.pages.dev/practice/?start=1&text=${encoded}"
            output="/tmp/live-${name}.html"
            "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --window-size="${width},${height}" --virtual-time-budget=5000 \
              --run-all-compositor-stages-before-draw --dump-dom "$url" >"$output"
            grep -Fq "data-layout-mode=\"${expected_mode}\"" "$output"
            grep -Fq 'data-scroll-ok="true"' "$output"
            grep -Fq 'data-canonical-stroke-source="canonical-stroke-rendering-v2"' "$output"
            if grep -Fq 'data-display-glyph-layer' "$output"; then
              echo "Legacy display glyph remains in ${name}" >&2
              exit 1
            fi
            if [[ "$name" == *-da ]]; then
              grep -Fq 'data-canonical-stroke-count="4"' "$output"
              grep -Fq '1 / 4획' "$output"
            fi
            "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --window-size="${width},${height}" --virtual-time-budget=4000 \
              --run-all-compositor-stages-before-draw --screenshot="artifacts/production-canonical/${name}.png" "$url"
            test -s "artifacts/production-canonical/${name}.png"
            echo "live=${name} viewport=${width}x${height} mode=${expected_mode} canonical=ok scroll=ok"
          done
      - name: Upload live production canonical screenshots
        uses: actions/upload-artifact@v4
        with:
          name: production-canonical-screenshots
          path: artifacts/production-canonical
          if-no-files-found: error
          retention-days: 14
